<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>caampus lost-found</title>
    <link rel="stylesheet" href="login.css" />
    <link rel="stylesheet" href="login.py" />
    <link rel="stylesheet" href="login.html" />
  </head>
  <body>
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link rel="stylesheet" href="style.css" />
      </head>

      <body>
        <div class="login-container">
          <div class="login-card">
            <!-- Logo -->
            <div class="logo">
              <span>
                <img
                  src="https://lpucdn.npfs.co/uploads/template/524/2210/publish/images/lpu-logo.png?1778670918"
                  alt=""
                  class="imglogo"
                />
              </span>
            </div>
            <marquee behavior="" direction="left">
              <h1>Welcome Back</h1>
            </marquee>

            <p class="subtitle">Find what's lost. Return what's found.</p>

            <!-- Login Form -->
            <form>
              <div class="input-group">
                <label for="email"> 📩 College Email </label>

                <input
                  type="email"
                  placeholder="Enter your college email"
                  required
                />
              </div>

              <div class="input-group">
                <label for="password"> Password </label>

                <input
                  type="password"
                  id="password"
                  placeholder="Enter your password"
                  required
                />
              </div>

              <div class="login-options">
                <label>
                  <input type="checkbox" />
                  Remember me
                </label>

                <a href="#"> Forgot Password? </a>
              </div>
              <a href="lost.html"> <button type="button">login</button></a>
            </form>

            <!-- Register -->
            <p class="register">
              Don't have an account?

              <a href="create.html" target="_blank"> Create Account </a>
            </p>
          </div>
        </div>
      </body>
    </html>
  </body>
</html>
