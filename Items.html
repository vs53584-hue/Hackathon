<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus Lost & Found Directory</title>

  <!-- GOOGLE FONTS: Outfit (Headings/Locations) & Inter (UI/Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-body: #f8fafc;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      
      /* Category Color Accents */
      --danger-bg: #fee2e2;
      --danger-text: #dc2626;
      --danger-border: #fca5a5;

      --success-bg: #dcfce7;
      --success-text: #16a34a;
      --success-border: #86efac;

      --shadow-smooth: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      font-family: var(--font-body);
      padding: 2rem;
      position: relative;
    }

    /* TOP-LEFT PREVIOUS PAGE BUTTON */
    .back-nav {
      position: absolute;
      top: 1.5rem;
      left: 1.5rem;
      z-index: 100;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.9rem;
      background-color: var(--surface);
      color: var(--text-main);
      border: 1px solid #e2e8f0;
      border-radius: 9999px;
      font-family: var(--font-body);
      font-size: 0.875rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      transition: all 0.2s ease;
    }

    .btn-back:hover {
      background-color: #f1f5f9;
      transform: translateX(-2px);
      color: var(--text-main);
    }

    .btn-back:visited,
    .btn-back:active,
    .btn-back:focus {
      color: inherit;
      text-decoration: none;
      outline: none;
    }

    .btn-back svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    /* PAGE HEADER */
    .portal-header {
      margin-top: 1.5rem;
      margin-bottom: 2.5rem;
      text-align: center;
    }

    .portal-header h1 {
      font-family: var(--font-heading);
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .portal-header p {
      color: var(--text-sub);
      margin-top: 0.35rem;
    }

    /* MAIN GRID LAYOUT */
    .portal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 1.75rem;
      max-width: 1050px;
      margin: 0 auto;
    }

    /* CARD STYLING */
    .section-card {
      background: var(--surface);
      border-radius: 16px;
      padding: 1.75rem;
      box-shadow: var(--shadow-smooth);
      border: 1px solid #f1f5f9;
    }

    .section-title {
      font-family: var(--font-heading);
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .section-desc {
      font-size: 0.875rem;
      color: var(--text-sub);
      margin-bottom: 1.5rem;
    }

    .items-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      background-color: #f8fafc;
      border-radius: 12px;
      border: 1px solid #f1f5f9;
    }

    .item-info {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .item-name {
      font-weight: 600;
      font-size: 0.95rem;
    }

    /* FONT STYLING FOR LOCATION & CATEGORY */
    .item-meta {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
    }

    .item-location {
      font-family: var(--font-heading);
      font-weight: 600;
      color: #334155;
    }

    .category-chip {
      background-color: #e2e8f0;
      color: #475569;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-size: 0.725rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    /* TAG LINK STYLING (NO HYPERLINK GLOW OR UNDERLINE) */
    .tag-link {
      display: inline-block;
      padding: 0.4rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.775rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .tag-link:hover {
      transform: translateY(-1px);
    }

    .tag-lost {
      background-color: var(--danger-bg);
      color: var(--danger-text);
      border: 1px solid var(--danger-border);
    }

    .tag-found {
      background-color: var(--success-bg);
      color: var(--success-text);
      border: 1px solid var(--success-border);
    }

    .tag-link:visited,
    .tag-link:hover,
    .tag-link:active,
    .tag-link:focus {
      text-decoration: none;
      outline: none;
    }

    .empty-msg {
      color: var(--text-sub);
      font-size: 0.875rem;
      font-style: italic;
    }
  </style>
</head>
<body>

  <!-- PREVIOUS PAGE NAVIGATION BUTTON -->
  <div class="back-nav">
    <a href="lost.html">
    <button onclick="history.back()" class="btn-back" title="Return to previous page">
      <svg viewBox="0 0 24 24">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>Back</span>
    </button></a>
  </div>

  <!-- HEADER -->
  <div class="portal-header">
    <h1>Item Location Directory</h1>
    <p>Browse reported lost and found items grouped by location and category</p>
  </div>

  <!-- CONTENT GRID -->
  <div class="portal-grid">

    <!-- SECTION 1: LOST ITEMS -->
    <div class="section-card">
      <div class="section-title">
        <span style="color: var(--danger-text);">●</span> Lost Items
      </div>
      <p class="section-desc">Active reports awaiting recovery.</p>

      <div class="items-list" id="lostItemsContainer">
        <!-- Rendered dynamically via Script below -->
      </div>
    </div>

    <!-- SECTION 2: FOUND ITEMS -->
    <div class="section-card">
      <div class="section-title">
        <span style="color: var(--success-text);">●</span> Found Items
      </div>
      <p class="section-desc">Recovered items held at campus posts.</p>

      <div class="items-list" id="foundItemsContainer">
        <!-- Rendered dynamically via Script below -->
      </div>
    </div>

  </div>

  <script>
    function loadDirectoryItems() {
      // 1. Fetch items submitted via lost_info.html
      const lostContainer = document.getElementById('lostItemsContainer');
      const storedLost = JSON.parse(localStorage.getItem('campusFindItems')) || [];

      if (storedLost.length === 0) {
        // Fallback default static items if local storage is empty
        lostContainer.innerHTML = `
          <div class="item-row">
            <div class="item-info">
              <span class="item-name">Blue Water Bottle</span>
              <div class="item-meta">
                <span class="item-location">📍 Block 34 (1st Floor)</span>
                <span class="category-chip">Accessories</span>
              </div>
            </div>
            <a href="lost.html" class="tag-link tag-lost">#Lost-0824</a>
          </div>
          <div class="item-row">
            <div class="item-info">
              <span class="item-name">Scientific Calculator</span>
              <div class="item-meta">
                <span class="item-location">📍 Central Library</span>
                <span class="category-chip">Electronics</span>
              </div>
            </div>
            <a href="lost.html" class="tag-link tag-lost">#Lost-0825</a>
          </div>
        `;
      } else {
        lostContainer.innerHTML = storedLost.map((item, index) => {
          const tagId = item.id || `#Lost-${String(index + 1000).padStart(4, '0')}`;
          const category = item.category || 'General';
          return `
            <div class="item-row">
              <div class="item-info">
                <span class="item-name">${item.name}</span>
                <div class="item-meta">
                  <span class="item-location">📍 ${item.location}</span>
                  <span class="category-chip">${category}</span>
                </div>
              </div>
              <a href="lost.html" class="tag-link tag-lost">${tagId}</a>
            </div>
          `;
        }).join('');
      }

      // 2. Fetch items submitted via found_info.html
      const foundContainer = document.getElementById('foundItemsContainer');
      const storedFound = JSON.parse(localStorage.getItem('campusFoundItems')) || [];

      if (storedFound.length === 0) {
        // Fallback default static items if local storage is empty
        foundContainer.innerHTML = `
          <div class="item-row">
            <div class="item-info">
              <span class="item-name">Student ID Card</span>
              <div class="item-meta">
                <span class="item-location">📍 Canteen (Block 36)</span>
                <span class="category-chip">Documents</span>
              </div>
            </div>
            <a href="found.html" class="tag-link tag-found">#Found-1102</a>
          </div>
          <div class="item-row">
            <div class="item-info">
              <span class="item-name">Car Keys</span>
              <div class="item-meta">
                <span class="item-location">📍 Main Gate Desk</span>
                <span class="category-chip">Keys</span>
              </div>
            </div>
            <a href="found.html" class="tag-link tag-found">#Found-1103</a>
          </div>
        `;
      } else {
        foundContainer.innerHTML = storedFound.map((item, index) => {
          const tagId = item.id || `#Found-${String(index + 2000).padStart(4, '0')}`;
          const category = item.category || 'General';
          return `
            <div class="item-row">
              <div class="item-info">
                <span class="item-name">${item.name}</span>
                <div class="item-meta">
                  <span class="item-location">📍 ${item.location}</span>
                  <span class="category-chip">${category}</span>
                </div>
              </div>
              <a href="found.html" class="tag-link tag-found">${tagId}</a>
            </div>
          `;
        }).join('');
      }
    }

    document.addEventListener('DOMContentLoaded', loadDirectoryItems);
  </script>
</body>
</html>
